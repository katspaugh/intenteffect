<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntentEffect Tasks</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 560px;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.4rem; }
      form { display: flex; gap: 0.5rem; margin: 1rem 0; }
      input[type='text'] { flex: 1; padding: 0.5rem; font-size: 1rem; }
      button { cursor: pointer; padding: 0.4rem 0.7rem; }
      ul { list-style: none; padding: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.25rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      li span { flex: 1; }
      .status { font-size: 0.8rem; opacity: 0.7; }
      .status::before {
        content: '●';
        margin-right: 0.35rem;
      }
      .status.live::before { color: #2da44e; }
      .status.connecting::before,
      .status.reconnecting::before { color: #d4a72c; }
      .status.idle::before { color: #999; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
